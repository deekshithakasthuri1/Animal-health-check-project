<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Health Result</title>
  <style>
    :root {
      --accent: #2f855a;
      --danger: #c53030;
      --muted: #6b7280
    }

    body {
      font-family: Inter, Arial, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f6f8fa;
      background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)),
      url("{{ url_for('static', filename='petpicture.png') }}");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: cover;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.08)
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      font-weight: 700
    }

    .ok {
      background: var(--accent)
    }

    .warn {
      background: var(--danger)
    }

    .meta {
      color: var(--muted);
      margin-top: 8px
    }

    .actions {
      margin-top: 18px;
      display: flex;
      gap: 12px
    }

    a.button {
      background: #111827;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      text-decoration: none
    }

    .confidence {
      font-weight: 700
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Health Result</h1>

    {% set healthy = 'healthy' in result.status.lower() %}
    <div style="display:flex;align-items:center;gap:12px">
      <div class="badge {{ 'ok' if healthy else 'warn' }}">{{ result.status }}</div>
      <div class="meta">Confidence: <span class="confidence">{{ result.confidence }}</span></div>
    </div>

    <div class="actions">
      <a class="button" href="/">Check Another Animal</a>
    </div>

    <!-- Contextual guidance message -->
    <div style="margin-top:16px;font-size:15px;color:#111827">
      {% if healthy %}
      <p>It's okay it just needs rest, treats and your love .</p>
      {% else %}
      <p>Please visit a veterinarian this looks urgent.</p>
      {% endif %}
    </div>
  </div>
</body>

</html>
